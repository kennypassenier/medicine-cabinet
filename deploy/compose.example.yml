# Running the image with docker compose (T7: self-update is off inside an
# image by detection; updates are a new image). The logging block is the
# rotation for the container's stdout (H4); without it the json-file driver
# grows without bound.
services:
  medicine-cabinet:
    image: ghcr.io/kennypassenier/medicine-cabinet:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    # MEDICINE_CABINET_PUBLIC_URL is not in this list: it is a passkeys knob, and
    # the scaffold builds without that feature (feat-build-1).
    env_file: /etc/medicine-cabinet/medicine-cabinet.env   # MEDICINE_CABINET_TOKEN, MEDICINE_CABINET_SECRET_KEY
    volumes:
      - medicine-cabinet-state:/var/lib/medicine-cabinet    # a named volume inherits the image's owner
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
volumes:
  medicine-cabinet-state:
